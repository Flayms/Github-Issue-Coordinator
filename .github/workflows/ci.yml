name: CI

# Runs on drafts too: agent PRs stay drafts until their Review (REQ-001-31), and the
# Coordinator waits for these checks before reviewing (REQ-001-10).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the version the server runs
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
